<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="One listener's 5 euros split by their own streams">
<style>svg{--fg:#f3eaed;--muted:#b3a3a9;--line:#5a474f;--box:#231a1e;--accent:#ff7096;--on:#171114;--soft:#4a2531}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-weight:650}.s{fill:var(--muted)}.h{font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.on{fill:var(--on)}.ac{fill:var(--accent);font-weight:650}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.solid{fill:var(--accent)}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 6}
.mk{fill:var(--line)}.mka{fill:var(--accent)}
.dot{fill:var(--on);stroke:var(--accent);stroke-width:2}.dots{fill:var(--soft)}
.panel{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6}
@media (prefers-reduced-motion:reduce){.dot,.dots{display:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="box" x="24" y="108" width="176" height="84" rx="12"/><text x="112" y="147" font-size="14.5" text-anchor="middle" class="t">Listener</text><text x="112" y="165" font-size="12" text-anchor="middle" class="s">5 € + VAT per month</text><path class="la" d="M200 150H276" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#b)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.6s" begin="-0.7s" repeatCount="indefinite" path="M200 150H276"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.6s" begin="-0.7s" repeatCount="indefinite"/></circle><rect class="solid" x="284" y="100" width="196" height="100" rx="12"/><text x="382" y="147" font-size="14.5" text-anchor="middle" class="t on">Split by your streams</text><text x="382" y="165" font-size="12" text-anchor="middle" class="on">10 streams this month</text><path class="la" d="M480 132C526 132 520 58 564 58" style="stroke-width:6;stroke-linecap:butt" marker-end="url(#c)"/><circle class="dot" r="4.2" opacity="0"><animateMotion dur="2.2s" begin="-1.4s" repeatCount="indefinite" path="M480 132C526 132 520 58 564 58"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.2s" begin="-1.4s" repeatCount="indefinite"/></circle><path class="la" d="M480 150H564" style="stroke-width:3.5;stroke-linecap:butt" marker-end="url(#c)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.8s" begin="-2.1s" repeatCount="indefinite" path="M480 150H564"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.8s" begin="-2.1s" repeatCount="indefinite"/></circle><path class="la" d="M480 168C526 168 520 242 564 242" style="stroke-width:1.8;stroke-linecap:butt" marker-end="url(#b)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="3.6s" begin="-2.8s" repeatCount="indefinite" path="M480 168C526 168 520 242 564 242"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="3.6s" begin="-2.8s" repeatCount="indefinite"/></circle><rect class="box" x="574" y="24" width="162" height="68" rx="12"/><text x="655" y="55" font-size="14.5" text-anchor="middle" class="t">Artist A</text><text x="655" y="73" font-size="12" text-anchor="middle" class="s">6 of 10 · 3.00 €</text><rect class="box" x="574" y="116" width="162" height="68" rx="12"/><text x="655" y="147" font-size="14.5" text-anchor="middle" class="t">Artist B</text><text x="655" y="165" font-size="12" text-anchor="middle" class="s">3 of 10 · 1.50 €</text><rect class="box" x="574" y="208" width="162" height="68" rx="12"/><text x="655" y="239" font-size="14.5" text-anchor="middle" class="t">Artist C</text><text x="655" y="257" font-size="12" text-anchor="middle" class="s">1 of 10 · 0.50 €</text>
</svg>
