<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Architecture: artist repo and audio host, appview, player">
<style>svg{--fg:#1e1418;--muted:#6f6268;--line:#cdbcc3;--box:#f4ecef;--accent:#c8234f;--on:#ffffff;--soft:#f6d9e1}@media (prefers-color-scheme:dark){svg{--fg:#f3eaed;--muted:#b3a3a9;--line:#5a474f;--box:#231a1e;--accent:#ff7096;--on:#171114;--soft:#4a2531}}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-weight:650}.s{fill:var(--muted)}.h{font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.on{fill:var(--on)}.ac{fill:var(--accent);font-weight:650}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.solid{fill:var(--accent)}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 6}
.mk{fill:var(--line)}.mka{fill:var(--accent)}
.dot{fill:var(--on);stroke:var(--accent);stroke-width:2}.dots{fill:var(--soft)}
.panel{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6}
@media (prefers-reduced-motion:reduce){.dot,.dots{display:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="box" x="24" y="40" width="226" height="76" rx="12"/><text x="137" y="75" font-size="14.5" text-anchor="middle" class="t">Artist's atproto repo</text><text x="137" y="93" font-size="12" text-anchor="middle" class="s">profile · track · release</text><rect class="box" x="24" y="190" width="226" height="76" rx="12"/><text x="137" y="225" font-size="14.5" text-anchor="middle" class="t">Artist's audio host</text><text x="137" y="243" font-size="12" text-anchor="middle" class="s">files · checks the grant</text><rect class="solid" x="318" y="40" width="172" height="76" rx="12"/><text x="404" y="75" font-size="14.5" text-anchor="middle" class="t on">Appview</text><text x="404" y="93" font-size="10.9" text-anchor="middle" class="on">index · grants · settlement</text><rect class="box" x="564" y="40" width="172" height="76" rx="12"/><text x="650" y="75" font-size="14.5" text-anchor="middle" class="t">Player</text><text x="650" y="93" font-size="12" text-anchor="middle" class="s">listener's app</text><path class="ln" d="M250 78H310" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.6s" begin="-0.7s" repeatCount="indefinite" path="M250 78H310"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.6s" begin="-0.7s" repeatCount="indefinite"/></circle><text x="280" y="66" font-size="12" text-anchor="middle" class="s">records</text><path class="la" d="M564 62H498" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#b)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2s" begin="-1.4s" repeatCount="indefinite" path="M564 62H498"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2s" begin="-1.4s" repeatCount="indefinite"/></circle><text x="531" y="32" font-size="12" text-anchor="middle" class="s">ask to play</text><path class="la" d="M490 94H556" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#b)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2s" begin="-0.1s" repeatCount="indefinite" path="M490 94H556"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2s" begin="-0.1s" repeatCount="indefinite"/></circle><text x="527" y="134" font-size="12" text-anchor="middle" class="s">URL + grant</text><path class="la" d="M650 116V228H258" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#b)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="3.4s" begin="-2.8s" repeatCount="indefinite" path="M650 116V228H258"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="3.4s" begin="-2.8s" repeatCount="indefinite"/></circle><text x="454" y="218" font-size="12" text-anchor="middle" class="s">audio request + grant</text>
</svg>
