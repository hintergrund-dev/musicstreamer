<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="One big pot compared with a per-listener split">
<style>svg{--fg:#1e1418;--muted:#6f6268;--line:#cdbcc3;--box:#f4ecef;--accent:#c8234f;--on:#ffffff;--soft:#f6d9e1}@media (prefers-color-scheme:dark){svg{--fg:#f3eaed;--muted:#b3a3a9;--line:#5a474f;--box:#231a1e;--accent:#ff7096;--on:#171114;--soft:#4a2531}}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-weight:650}.s{fill:var(--muted)}.h{font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.on{fill:var(--on)}.ac{fill:var(--accent);font-weight:650}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.solid{fill:var(--accent)}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 6}
.mk{fill:var(--line)}.mka{fill:var(--accent)}
.dot{fill:var(--on);stroke:var(--accent);stroke-width:2}.dots{fill:var(--soft)}
.panel{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6}
@media (prefers-reduced-motion:reduce){.dot,.dots{display:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path class="mka" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="panel" x="24" y="14" width="352" height="302" rx="16"/><text x="200" y="44" font-size="12" text-anchor="middle" class="h">ONE BIG POT</text><rect class="box" x="38" y="78" width="100" height="52" rx="12"/><text x="88" y="101" font-size="13.6" text-anchor="middle" class="t">Listener 1</text><text x="88" y="119" font-size="10.5" text-anchor="middle" class="s">90 streams of X</text><rect class="box" x="38" y="174" width="100" height="52" rx="12"/><text x="88" y="197" font-size="13.6" text-anchor="middle" class="t">Listener 2</text><text x="88" y="215" font-size="10.5" text-anchor="middle" class="s">10 streams of Y</text><circle class="solid" cx="200" cy="152" r="30"/><text x="200" y="149" font-size="12.5" text-anchor="middle" class="t on">Pot</text><text x="200" y="165" font-size="11.5" text-anchor="middle" class="on">10 €</text><path class="ln" d="M138 104C158 104 150 134 170 134" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.4s" begin="-0.7s" repeatCount="indefinite" path="M138 104C158 104 150 134 170 134"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.4s" begin="-0.7s" repeatCount="indefinite"/></circle><path class="ln" d="M138 200C158 200 150 170 170 170" style="stroke-width:2;stroke-linecap:butt" marker-end="url(#a)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.4s" begin="-1.4s" repeatCount="indefinite" path="M138 200C158 200 150 170 170 170"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.4s" begin="-1.4s" repeatCount="indefinite"/></circle><path class="la" d="M228 134C250 134 246 104 268 104" style="stroke-width:5;stroke-linecap:butt" marker-end="url(#c)"/><circle class="dot" r="3.7" opacity="0"><animateMotion dur="2.2s" begin="-2.1s" repeatCount="indefinite" path="M228 134C250 134 246 104 268 104"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.2s" begin="-2.1s" repeatCount="indefinite"/></circle><path class="la" d="M228 170C250 170 246 200 268 200" style="stroke-width:1.6;stroke-linecap:butt" marker-end="url(#b)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="3.4s" begin="-2.8s" repeatCount="indefinite" path="M228 170C250 170 246 200 268 200"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="3.4s" begin="-2.8s" repeatCount="indefinite"/></circle><rect class="box" x="278" y="78" width="84" height="52" rx="12"/><text x="320" y="101" font-size="13.5" text-anchor="middle" class="t">Artist X</text><text x="320" y="119" font-size="12" text-anchor="middle" class="s">9 €</text><rect class="box" x="278" y="174" width="84" height="52" rx="12"/><text x="320" y="197" font-size="13.5" text-anchor="middle" class="t">Artist Y</text><text x="320" y="215" font-size="12" text-anchor="middle" class="s">1 €</text><text x="200" y="276" font-size="12.5" text-anchor="middle" class="s">Shared by total streams:</text><text x="200" y="294" font-size="12.5" text-anchor="middle" class="s">4 € of Listener 2’s money goes to X.</text><rect class="panel" x="384" y="14" width="352" height="302" rx="16"/><text x="560" y="44" font-size="12" text-anchor="middle" class="h">PER-LISTENER SPLIT</text><rect class="box" x="398" y="78" width="100" height="52" rx="12"/><text x="448" y="101" font-size="13.6" text-anchor="middle" class="t">Listener 1</text><text x="448" y="119" font-size="10.5" text-anchor="middle" class="s">90 streams of X</text><rect class="box" x="398" y="174" width="100" height="52" rx="12"/><text x="448" y="197" font-size="13.6" text-anchor="middle" class="t">Listener 2</text><text x="448" y="215" font-size="10.5" text-anchor="middle" class="s">10 streams of Y</text><path class="la" d="M498 104H628" style="stroke-width:3.5;stroke-linecap:butt" marker-end="url(#c)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.6s" begin="-0.9s" repeatCount="indefinite" path="M498 104H628"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.6s" begin="-0.9s" repeatCount="indefinite"/></circle><path class="la" d="M498 200H628" style="stroke-width:3.5;stroke-linecap:butt" marker-end="url(#c)"/><circle class="dot" r="3.0" opacity="0"><animateMotion dur="2.6s" begin="-1.6s" repeatCount="indefinite" path="M498 200H628"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.62;0.8;1" dur="2.6s" begin="-1.6s" repeatCount="indefinite"/></circle><text x="560" y="94" font-size="12.5" text-anchor="middle" class="ac">5 €</text><text x="560" y="190" font-size="12.5" text-anchor="middle" class="ac">5 €</text><rect class="box" x="638" y="78" width="84" height="52" rx="12"/><text x="680" y="101" font-size="13.5" text-anchor="middle" class="t">Artist X</text><text x="680" y="119" font-size="12" text-anchor="middle" class="s">5 €</text><rect class="box" x="638" y="174" width="84" height="52" rx="12"/><text x="680" y="197" font-size="13.5" text-anchor="middle" class="t">Artist Y</text><text x="680" y="215" font-size="12" text-anchor="middle" class="s">5 €</text><text x="560" y="276" font-size="12.5" text-anchor="middle" class="s">Each listener’s 5 € goes only</text><text x="560" y="294" font-size="12.5" text-anchor="middle" class="s">to the artists they played.</text>
</svg>
